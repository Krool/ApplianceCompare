version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # react and react-dom peer each other; split PRs fail npm ci.
      react:
        patterns: ["react", "react-dom"]
      dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      scripts:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
